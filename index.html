<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Descontos - Farmácia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Calculadora de Desconto por Medicamentos Vencidos</h1>
    
    <label for="peso">Peso dos medicamentos vencidos (kg):</label>
    <input type="number" id="peso" step="0.01" min="0" placeholder="Ex: 2.5">

    <label for="valorCompra">Valor da compra (R$):</label>
    <input type="number" id="valorCompra" step="0.01" min="0" placeholder="Ex: 150.00">

    <button onclick="calcularDesconto()">Calcular Desconto</button>

    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
